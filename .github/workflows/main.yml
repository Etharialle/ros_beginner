# .github/workflows/main.yml

name: C++ CI with Bazel

# This workflow runs on every pull request that targets the 'main' branch.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Permissions are required for the workflow to post a comment on the PR.
permissions:
  pull-requests: write # To add a PR comment
  contents: read       # To check out the repository

jobs:
  # --- JOB 1: Build the binary ---
  # This job quickly verifies that the code compiles.
  build:
    name: Build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/etharialle/ros_beginner/ci-image:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build all targets
        run: bazel build //...

  # --- JOB 2: Run tests and report coverage ---
  # This job depends on the 'build' job succeeding first.
  test-and-coverage:
    name: Test & Coverage
    
    #needs: build # This job will only run if the 'build' job is successful
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/etharialle/ros_beginner/ci-image:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests with coverage
        run: bazel coverage --config=clang --instrumentation_filter="//..." --experimental_generate_llvm_lcov --combined_report=lcov //...

      - name: Process LLVM Coverage Report
        id: coverage-summary
        run: |
          set -e # Exit immediately if a command fails
          
          # --- STEP 1: Find the necessary files ---
          # Bazel creates the profraw file in a complex path. We find it.
          PROFRAW_FILE=$(find bazel-out/ -name "*.profraw" | head -n 1)
          if [ -z "$PROFRAW_FILE" ]; then
            echo "::error::No .profraw coverage file found. Build may have failed or produced no coverage."
            exit 1
          fi
          
          # We also need the test executable itself to map coverage to source code.
          TEST_EXECUTABLE=$(find bazel-bin/ -name "ese_test")
          if [ -z "$TEST_EXECUTABLE" ]; then
            echo "::error::Test executable not found."
            exit 1
          fi
          
          echo "Found profraw file: $PROFRAW_FILE"
          echo "Found test executable: $TEST_EXECUTABLE"
          
          # --- STEP 2: Merge the raw profile data ---
          # This converts the .profraw file into the final .profdata format.
          llvm-profdata merge -sparse "$PROFRAW_FILE" -o coverage.profdata
          
          # --- STEP 3: Generate the HTML report ---
          # This is the equivalent of genhtml. It creates a rich, interactive HTML report.
          # We need to specify all the source files we care about.
          mkdir -p coverage_report
          llvm-cov show "$TEST_EXECUTABLE" \
            -instr-profile=coverage.profdata \
            -format=html \
            -output-dir=coverage_report \
            -show-line-counts-or-regions \
            $(find src/ -name "*.cpp") $(find include/ -name "*.hpp")

          # --- STEP 4: Generate a summary and extract the percentage ---
          # We use llvm-cov report to get a text summary for the PR comment.
          COVERAGE_SUMMARY=$(llvm-cov report "$TEST_EXECUTABLE" -instr-profile=coverage.profdata)
          echo "$COVERAGE_SUMMARY"
          
          # Extract the total line coverage percentage from the "TOTAL" line.
          COVERAGE_PERCENTAGE=$(echo "$COVERAGE_SUMMARY" | grep "TOTAL" | awk '{print $4}' | sed 's/%//')
          echo "Total line coverage is $COVERAGE_PERCENTAGE%"
          echo "percentage=${COVERAGE_PERCENTAGE}" >> $GITHUB_OUTPUT
          
          # --- STEP 5: Check against the threshold ---
          if (( $(echo "$COVERAGE_PERCENTAGE < 50" | bc -l) )); then
            echo "::warning title=Low Code Coverage::Code coverage is ${COVERAGE_PERCENTAGE}%, which is below the 50% threshold."
          else
            echo "Code coverage is ${COVERAGE_PERCENTAGE}%, which meets the 50% threshold."
          fi

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: coverage_report # The directory created by genhtml

      - name: Add Coverage Comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get the coverage percentage from the previous step's output
            const coveragePercentage = "${{ steps.coverage-summary.outputs.percentage }}";
            
            // Craft the comment body using Markdown
            const body = `
            ## Code Coverage Report 
            
            | Category          | Result                |
            |-------------------|-----------------------|
            | **Line Coverage** | **\`${coveragePercentage}%\`** |
            
            A detailed HTML report has been generated and can be downloaded from the [**action artifacts**](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            
            *Coverage threshold: 50% (warning only)*
            `;
            
            // Post the comment to the pull request
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
